{{define "register.html"}}{{template "head" .}}
{{template "nav" .}}

<main class="auth-wrap">
  <div class="card auth-card">
    <h1>创建账号</h1>
    <p class="dim">注册后使用激活码即可开通实例。</p>

    {{template "flash" .}}

    <form method="post" action="/register">
      <div class="field">
        <label for="email">邮箱</label>
        <input id="email" type="email" name="email" value="{{.Data.Email}}"
               autocomplete="username" required maxlength="254" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" type="password" name="password"
               autocomplete="new-password" required minlength="8" maxlength="128" placeholder="至少 8 位">
      </div>
      <div class="field">
        <label for="password2">确认密码</label>
        <input id="password2" type="password" name="password2"
               autocomplete="new-password" required minlength="8" maxlength="128" placeholder="再次输入">
      </div>
      <button class="btn btn-primary btn-block" type="submit">注册</button>
    </form>

    <p class="auth-alt">已有账号？<a href="/login">前往登录</a></p>
  </div>
</main>

{{template "foot" .}}{{end}}
